{% extends "base.html" %}
{% block title %}ایجاد کاربر جدید{% endblock %}
{% block content %}
<h2>ثبت کاربر جدید</h2>
<form method="POST">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">نام</label>
            <input type="text" class="form-control" name="first_name" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">نام خانوادگی</label>
            <input type="text" class="form-control" name="last_name" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">کد</label>
            <input type="text" class="form-control" name="code" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">نام کاربری</label>
            <input type="text" class="form-control" name="username" required>
        </div>
        <div class="col-md-4 mb-3">
            <label class="form-label">رمز عبور</label>
            <input type="password" class="form-control" name="password" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4 mb-3">
            <label class="form-label">کارخانه</label>
            <select class="form-select" name="factory_id" required>
                <option value="">انتخاب کنید</option>
                {% for factory in factories %}
                <option value="{{ factory.id }}">{{ factory.name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-md-4 mb-3">
            <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" id="is_approver" name="is_approver">
                <label class="form-check-label" for="is_approver">تأییدکننده</label>
            </div>
        </div>
    </div>
    <button type="submit" class="btn btn-success">ایجاد کاربر</button>
    <a href="{{ url_for('admin.user_list') }}" class="btn btn-secondary">بازگشت</a>
</form>
{% endblock %}
