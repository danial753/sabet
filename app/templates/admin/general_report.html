{% extends "base.html" %}
{% block title %}گزارش جامع{% endblock %}
{% block content %}
<h2><i class="fas fa-file-excel me-2"></i>گزارش جامع مدیریتی</h2>

<form method="POST" action="{{ url_for('admin_report.general_report_download') }}">
    <div class="row">
        <div class="col-md-3 mb-3 order-md-1">
            <button type="submit" class="btn btn-success w-100"><i class="fas fa-download me-1"></i>دانلود اکسل</button>
        </div>
        <div class="col-md-3 mb-3 order-md-2">
            <label class="form-label">تا تاریخ (شمسی)</label>
            <input type="text" class="form-control" name="end_date" placeholder="YYYY-MM-DD" value="{{ today }}" required>
        </div>
        <div class="col-md-3 mb-3 order-md-3">
            <label class="form-label">از تاریخ (شمسی)</label>
            <input type="text" class="form-control" name="start_date" placeholder="YYYY-MM-DD" value="{{ today }}" required>
        </div>
        <div class="col-md-3 mb-3 order-md-4">
            <label class="form-label">کد کاربر</label>
            <input type="text" class="form-control" name="user_code" placeholder="خالی = همه کاربران">
        </div>
    </div>
    <div class="text-muted small mb-3">
        📌 برای دریافت گزارش <strong>تمامی پرسنل</strong>، کد کاربر را خالی بگذارید.
    </div>
</form>
{% endblock %}
