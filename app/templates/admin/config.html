{% extends "base.html" %}
{% block title %}تنظیمات{% endblock %}
{% block content %}
<h2>پیکربندی سیستم</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">حد مجاز هشدار زمانی (%)</label>
        <input type="number" step="0.1" class="form-control" name="warning_threshold" value="{{ current_threshold }}" min="0" max="100">
        <small class="text-muted">اگر مدت واقعی بیش از این درصد از زمان مورد انتظار بیشتر شود، هشدار نمایش داده می‌شود.</small>
    </div>
    <button type="submit" class="btn btn-success">ذخیره</button>
</form>
{% endblock %}
