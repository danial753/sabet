{% extends "base.html" %}
{% block title %}تغییر رمز عبور{% endblock %}
{% block content %}
<h2><i class="fas fa-key me-2"></i>تغییر رمز عبور</h2>
<form method="POST">
    <div class="mb-3">
        <label class="form-label">رمز عبور فعلی</label>
        <input type="password" class="form-control" name="current_password" required>
    </div>
    <div class="mb-3">
        <label class="form-label">رمز عبور جدید</label>
        <input type="password" class="form-control" name="new_password" required>
    </div>
    <div class="mb-3">
        <label class="form-label">تکرار رمز عبور جدید</label>
        <input type="password" class="form-control" name="confirm_password" required>
    </div>
    <button type="submit" class="btn btn-success"><i class="fas fa-save me-1"></i>تغییر رمز</button>
    <a href="{{ url_for('profile.view') }}" class="btn btn-secondary"><i class="fas fa-arrow-right me-1"></i>بازگشت</a>
</form>
{% endblock %}
