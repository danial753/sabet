{% extends "base.html" %}
{% block title %}ویرایش پروفایل{% endblock %}
{% block content %}
<h2>ویرایش اطلاعات</h2>
<form method="POST">
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">نام</label>
            <input type="text" class="form-control" name="first_name" value="{{ current_user.first_name }}" required>
        </div>
        <div class="col-md-6 mb-3">
            <label class="form-label">نام خانوادگی</label>
            <input type="text" class="form-control" name="last_name" value="{{ current_user.last_name }}" required>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label class="form-label">کد</label>
            <input type="text" class="form-control" name="code" value="{{ current_user.code }}" required>
        </div>
    </div>
    <button type="submit" class="btn btn-success">ذخیره</button>
    <a href="{{ url_for('profile.view') }}" class="btn btn-secondary">بازگشت</a>
</form>
{% endblock %}
